<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dịch Vụ Sự Kiện Chung Sức Bắn Bi</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body {
      background-color: #f4f6f9;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      position: relative;
      overflow-x: hidden;
    }

    /* Canvas Hiệu ứng bi rơi */
    #marbles-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none; /* Không làm vướng click người dùng */
      z-index: 9999;
    }

    /* Style chung cho ảnh đầu trang và cuối trang */
    .banner-header-footer {
      width: 100%;
      text-align: center;
      margin: 15px 0;
    }

    .banner-header-footer img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
    }

    /* Card Dịch Vụ */
    .service-card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      border: 1px solid #eef2f7;
      overflow: hidden;
      max-width: 650px;
      margin: 20px auto;
      position: relative;
      z-index: 10;
    }

    /* KHUNG CHỨA ẢNH - NỀN TRẮNG */
    .service-img-container {
      width: 100%;
      background-color: #ffffff;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* HIỂN THỊ TRỌN VẸN BỨC ẢNH SỰ KIỆN */
    .service-img {
      width: 100%;
      max-width: 100%;
      height: auto;
      display: block;
    }

    /* Tag Note Giá Nổi Bật */
    .note-badge {
      background: linear-gradient(135deg, #ff416c, #ff4b2b);
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 15px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 10px rgba(255, 65, 108, 0.3);
    }

    /* Style cho Select */
    .form-select {
      border-color: #dee2e6;
      padding: 0.65rem 0.85rem;
      font-size: 14px;
      border-radius: 8px;
    }

    .form-select:focus {
      border-color: #0d6efd;
      box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.15);
    }

    /* Nút Tạo Đơn Hàng */
    .btn-create-order {
      background-color: #93a5e6;
      color: #ffffff;
      border: none;
      padding: 12px 30px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      transition: all 0.2s ease;
      cursor: pointer;
      text-decoration: none;
    }

    .btn-create-order:hover {
      background-color: #8194dc;
      color: #ffffff;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

<!-- CANVAS HIỆU ỨNG BI RƠI LIÊN TỤC -->
<canvas id="marbles-canvas"></canvas>

<div class="container px-3">

  <!-- 1. ẢNH ĐẦU TRANG -->
  <div class="banner-header-footer">
    <img src="https://i.ibb.co/TDcypns8/image.jpg" alt="Banner Đầu Trang">
  </div>

  <div class="service-card">
    
    <!-- HÌNH ẢNH SỰ KIỆN CHÍNH -->
    <div class="service-img-container">
      <img src="https://i.ibb.co/2aOboQmpgYU52l4FKNFhi45cg2fs7Ko1XLJU16uW.jpg" alt="Sự Kiện Chung Sức Bắn Bi" class="service-img">
    </div>

    <div class="p-4">
      
      <!-- NOTE GIÁ (ĐÃ XÓA CHỮ TIÊU ĐỀ TRÊN NÓ) -->
      <div class="text-center mb-4">
        <span class="note-badge">
          <i class="fa-solid fa-fire"></i> Note: 1 rương 25k | Full 3 rương 40k
        </span>
      </div>

      <!-- FORM TẠO ĐƠN HÀNG -->
      <form id="packageOrderForm">
        
        <!-- Chọn Gói -->
        <div class="mb-4">
          <label class="form-label fw-bold text-secondary" style="font-size: 14px;">Chọn Gói Cần Thuê</label>
          <select class="form-select" id="selectPackage" required>
            <option value="" selected disabled>-- Bấm để chọn gói dịch vụ --</option>
            <option value="1_ruong">1 Rương Trang Phục - 25,000 đ</option>
            <option value="3_ruong">Full 3 Rương Trang Phục - 40,000 đ</option>
          </select>
        </div>

        <!-- NÚT TẠO ĐƠN HÀNG -->
        <div class="text-center">
          <p class="text-muted small mb-2 fw-semibold">Vui lòng chọn gói dịch vụ trước khi tạo đơn</p>
          <button type="submit" class="btn-create-order shadow-sm">
            <i class="fa-solid fa-cart-shopping"></i>
            <span>Tạo Đơn Hàng</span>
          </button>
        </div>

      </form>

    </div>
  </div>

  <!-- 2. ẢNH CUỐI TRANG -->
  <div class="banner-header-footer">
    <img src="https://i.ibb.co/qYkC3Km8/image.jpg" alt="Banner Cuối Trang">
  </div>

</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- SCRIPT HIỆU ỨNG BI RƠI -->
<script>
  const canvas = document.getElementById('marbles-canvas');
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  const colors = ['#ff4b2b', '#ff416c', '#ffb703', '#2a9d8f', '#4cc9f0', '#7209b7'];
  const marbles = [];
  const marbleCount = 35; // Số lượng bi rơi cùng lúc

  class Marble {
    constructor() {
      this.reset();
    }

    reset() {
      this.x = Math.random() * canvas.width;
      this.y = -Math.random() * canvas.height;
      this.radius = Math.random() * 6 + 4; // Kích thước viên bi (4px - 10px)
      this.speedY = Math.random() * 2 + 1.5; // Tốc độ rơi
      this.speedX = Math.sin(Math.random() * Math.PI) * 0.8; // Độ lắc ngang
      this.color = colors[Math.floor(Math.random() * colors.length)];
      this.opacity = Math.random() * 0.5 + 0.5;
    }

    update() {
      this.y += this.speedY;
      this.x += this.speedX;

      // Khi bi rơi xuống hết màn hình thì quay lại từ trên xuống
      if (this.y - this.radius > canvas.height) {
        this.reset();
        this.y = -10;
      }
    }

    draw() {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      
      // Tạo bóng sáng 3D cho viên bi
      let gradient = ctx.createRadialGradient(
        this.x - this.radius * 0.3, 
        this.y - this.radius * 0.3, 
        this.radius * 0.1, 
        this.x, 
        this.y, 
        this.radius
      );
      gradient.addColorStop(0, '#ffffff');
      gradient.addColorStop(0.4, this.color);
      gradient.addColorStop(1, '#000000');

      ctx.fillStyle = gradient;
      ctx.globalAlpha = this.opacity;
      ctx.fill();
      ctx.closePath();
      ctx.globalAlpha = 1.0;
    }
  }

  for (let i = 0; i < marbleCount; i++) {
    marbles.push(new Marble());
  }

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    marbles.forEach(marble => {
      marble.update();
      marble.draw();
    });
    requestAnimationFrame(animate);
  }

  animate();

  // Chuyển hướng khi bấm submit
  const LINK_MOI = "https://google.com"; 
  document.getElementById('packageOrderForm').addEventListener('submit', function(e) {
    e.preventDefault();
    alert("Tạo đơn hàng thành công! Đang chuyển hướng...");
    window.location.href = LINK_MOI;
  });
</script>

</body>
</html>
