<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dịch Vụ Sự Kiện Chung Sức Bắn Bi</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body {
      background-color: #f4f6f9;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Style chung cho ảnh đầu trang và cuối trang */
    .banner-header-footer {
      width: 100%;
      text-align: center;
      margin: 15px 0;
    }

    .banner-header-footer img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
    }

    /* Card Dịch Vụ */
    .service-card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      border: 1px solid #eef2f7;
      overflow: hidden;
      max-width: 650px;
      margin: 20px auto;
    }

    /* KHUNG CHỨA ẢNH - NỀN TRẮNG */
    .service-img-container {
      width: 100%;
      background-color: #ffffff;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* HIỂN THỊ TRỌN VẸN BỨC ẢNH SỰ KIỆN */
    .service-img {
      width: 100%;
      max-width: 100%;
      height: auto;
      display: block;
    }

    /* Tag Note Giá Nổi Bật */
    .note-badge {
      background: linear-gradient(135deg, #ff416c, #ff4b2b);
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 15px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 10px rgba(255, 65, 108, 0.3);
    }

    /* Style cho Select */
    .form-select {
      border-color: #dee2e6;
      padding: 0.65rem 0.85rem;
      font-size: 14px;
      border-radius: 8px;
    }

    .form-select:focus {
      border-color: #0d6efd;
      box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.15);
    }

    /* Nút Tạo Đơn Hàng */
    .btn-create-order {
      background-color: #93a5e6;
      color: #ffffff;
      border: none;
      padding: 12px 30px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      transition: all 0.2s ease;
      cursor: pointer;
      text-decoration: none;
    }

    .btn-create-order:hover {
      background-color: #8194dc;
      color: #ffffff;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

<div class="container px-3">
  
  <!-- 1. ẢNH ĐẦU TRANG (GIỮ NGUYÊN) -->
  <div class="banner-header-footer">
    <img src="https://i.ibb.co/TDcypns8/image.jpg" alt="Banner Đầu Trang">
  </div>

  <div class="service-card">
    
    <!-- HÌNH ẢNH SỰ KIỆN CHÍNH -->
    <div class="service-img-container">
      <img src="https://i.ibb.co/2aOboQmpgYU52l4FKNFhi45cg2fs7Ko1XLJU16uW.jpg" alt="Nhận Full Sự Kiện Chung Sức Bắn Bi" class="service-img">
    </div>

    <div class="p-4">
      
      <!-- Tiêu đề & Note Bảng Giá -->
      <div class="text-center mb-4">
        <h4 class="fw-bold text-uppercase text-dark mb-2">NHẬN FULL SỰ KIỆN - CHUNG SỨC BẮN BI</h4>
        
        <!-- NOTE GIÁ -->
        <div class="mt-2">
          <span class="note-badge">
            <i class="fa-solid fa-fire"></i> Note: 1 rương 25k | Full 3 rương 40k
          </span>
        </div>
      </div>

      <!-- FORM TẠO ĐƠN HÀNG -->
      <form id="packageOrderForm">
        
        <!-- Chọn Gói -->
        <div class="mb-4">
          <label class="form-label fw-bold text-secondary" style="font-size: 14px;">Chọn Gói Cần Thuê</label>
          <select class="form-select" id="selectPackage" required>
            <option value="" selected disabled>-- Bấm để chọn gói dịch vụ --</option>
            <option value="1_ruong">1 Rương Trang Phục - 25,000 đ</option>
            <option value="3_ruong">Full 3 Rương Trang Phục - 40,000 đ</option>
          </select>
        </div>

        <!-- NÚT TẠO ĐƠN HÀNG -->
        <div class="text-center">
          <p class="text-muted small mb-2 fw-semibold">Vui lòng chọn gói dịch vụ trước khi tạo đơn</p>
          <button type="submit" class="btn-create-order shadow-sm">
            <i class="fa-solid fa-cart-shopping"></i>
            <span>Tạo Đơn Hàng</span>
          </button>
        </div>

      </form>

    </div>
  </div>

  <!-- 2. ẢNH CUỐI TRANG (ĐÃ THAY MỚI) -->
  <div class="banner-header-footer">
    <img src="https://i.ibb.co/qYkC3Km8/image.jpg" alt="Banner Cuối Trang Mới">
  </div>

</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
  // Link chuyển hướng sau khi bấm nút Tạo Đơn Hàng
  const LINK_MOI = "https://google.com"; 

  document.getElementById('packageOrderForm').addEventListener('submit', function(e) {
    e.preventDefault();
    alert("Tạo đơn hàng thành công! Đang chuyển hướng...");
    window.location.href = LINK_MOI;
  });
</script>

</body>
</html>
