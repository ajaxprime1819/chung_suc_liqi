<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dịch Vụ Cày Rương Trang Phục</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body {
      background-color: #f4f6f9;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Card Dịch Vụ */
    .service-card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      border: 1px solid #eef2f7;
      overflow: hidden;
      max-width: 650px;
      margin: 30px auto;
    }

    /* Hiển thị ảnh dịch vụ */
    .service-img-container {
      position: relative;
      width: 100%;
      background-color: #000;
    }

    .service-img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    /* Tag Note Giá Nổi Bật */
    .note-badge {
      background: linear-gradient(135deg, #ff416c, #ff4b2b);
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 15px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 10px rgba(255, 65, 108, 0.3);
    }

    /* Style cho Input / Select */
    .form-control, .form-select {
      border-color: #dee2e6;
      padding: 0.65rem 0.85rem;
      font-size: 14px;
      border-radius: 8px;
    }

    .form-control:focus, .form-select:focus {
      border-color: #0d6efd;
      box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.15);
    }

    /* Nút Tạo Đơn Hàng */
    .btn-create-order {
      background-color: #93a5e6;
      color: #ffffff;
      border: none;
      padding: 12px 30px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      transition: all 0.2s ease;
      cursor: pointer;
      text-decoration: none;
    }

    .btn-create-order:hover {
      background-color: #8194dc;
      color: #ffffff;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

<div class="container px-3">
  
  <div class="service-card">
    
    <!-- 1. HÌNH ẢNH DỊCH VỤ -->
    <div class="service-img-container">
      <!-- Đường dẫn ảnh của bạn -->
      <img src="https://i.ibb.co/2aOboQmpgRnRFgG3vyIqlyrTLxFdt4tFrrMVV4rY.jpg" alt="Sự kiện Rương Trang Phục SS" class="service-img">
    </div>

    <div class="p-4">
      
      <!-- Tiêu đề & Note Bảng Giá -->
      <div class="text-center mb-4">
        <h4 class="fw-bold text-uppercase text-dark mb-2">DỊCH VỤ SỰ KIỆN - RƯƠNG TRANG PHỤC SS</h4>
        
        <!-- NOTE GIÁ THEO YÊU CẦU -->
        <div class="mt-2">
          <span class="note-badge">
            <i class="fa-solid fa-fire"></i> Note: 1 rương 25k | Full 3 rương 40k
          </span>
        </div>
      </div>

      <!-- FORM TẠO ĐƠN HÀNG -->
      <form id="packageOrderForm">
        
        <!-- Chọn Gói -->
        <div class="mb-3">
          <label class="form-label fw-bold text-secondary" style="font-size: 14px;">Chọn Gói Cần Thuê</label>
          <select class="form-select" id="selectPackage" required>
            <option value="" selected disabled>-- Bấm để chọn gói dịch vụ --</option>
            <option value="1_ruong">1 Rương Trang Phục - 25,000 đ</option>
            <option value="3_ruong">Full 3 Rương Trang Phục - 40,000 đ</option>
          </select>
        </div>

        <!-- Thông Tin Tài Khoản -->
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label fw-bold text-secondary" style="font-size: 14px;">Tài Khoản Game</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fa-regular fa-user"></i></span>
              <input type="text" class="form-control" placeholder="Tài khoản Garena / Facebook" required>
            </div>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-bold text-secondary" style="font-size: 14px;">Mật Khẩu</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
              <input type="password" class="form-control" placeholder="Mật khẩu game" required>
            </div>
          </div>
        </div>

        <!-- Ghi chú cho Admin -->
        <div class="mb-4">
          <label class="form-label fw-bold text-secondary" style="font-size: 14px;">Ghi Chú Yêu Cầu (Nếu có)</label>
          <textarea class="form-control" rows="2" placeholder="Ví dụ: Đã có sẵn 1 rương, cày thêm 2 rương nữa..."></textarea>
        </div>

        <!-- NÚT TẠO ĐƠN HÀNG VÀ LIÊN KẾT -->
        <div class="text-center">
          <p class="text-muted small mb-2 fw-semibold">Vui lòng kiểm tra kỹ thông tin trước khi tạo đơn</p>
          <button type="submit" class="btn-create-order shadow-sm">
            <i class="fa-solid fa-cart-shopping"></i>
            <span>Tạo Đơn Hàng</span>
          </button>
        </div>

      </form>

    </div>
  </div>

</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
  // CẤU HÌNH ĐƯỜNG LINK TRANG WEB BẠN MUỐN CHUYỂN TỚI SAU KHÍ TẠO ĐƠN SONG
  const LINK_MOI = "https://google.com"; // Thay đường link web/lịch sử đơn hàng của bạn vào đây

  document.getElementById('packageOrderForm').addEventListener('submit', function(e) {
    e.preventDefault(); // Ngăn trang tự tải lại
    
    alert("Tạo đơn hàng thành công! Đang chuyển hướng...");
    
    // Tự động chuyển tới liên kết bạn chọn
    window.location.href = LINK_MOI;
  });
</script>

</body>
</html>
